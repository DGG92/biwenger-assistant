spring.application.name=biwenger-assistant

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biwenger}
spring.datasource.username=${DB_USERNAME:biwenger}
spring.datasource.password=${DB_PASSWORD:biwenger}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

biwenger.base-url=${BIWENGER_BASE_URL:https://biwenger.as.com}
biwenger.token=${BIWENGER_TOKEN}
biwenger.league-id=${BIWENGER_LEAGUE_ID}
biwenger.user-id=${BIWENGER_USER_ID}
biwenger.version=${BIWENGER_VERSION}
biwenger.language=${BIWENGER_LANGUAGE:es}
biwenger.cdn-base-url=${BIWENGER_CDN_BASE_URL:https://cf.biwenger.com}
biwenger.competition=${BIWENGER_COMPETITION:la-liga}
biwenger.score=${BIWENGER_SCORE:100}

biwenger.sync.enabled=${BIWENGER_SYNC_ENABLED:false}
biwenger.sync.interval-ms=${BIWENGER_SYNC_INTERVAL_MS:300000}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1