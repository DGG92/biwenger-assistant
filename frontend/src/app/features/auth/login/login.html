<div class="login-page">

    <div class="login-card">

        <div class="brand">
            <div class="brand-mark">
                BA
            </div>

            <div class="brand-text">
                <h1>Biwenger Assistant</h1>
                <p>VII Güenguer</p>
            </div>
        </div>

        <div class="login-header">
            <h2>Iniciar sesión</h2>
            <p>Accede a tu asistente de Biwenger.</p>
        </div>

        <form class="login-form" (ngSubmit)="submit()">

            <label for="username">
                Usuario
            </label>

            <input id="username" name="username" type="text" [(ngModel)]="username" autocomplete="username"
                [disabled]="loading" required>

            <label for="password">
                Contraseña
            </label>

            <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password"
                [disabled]="loading" required>

            @if (errorMessage) {
            <div class="error-message">
                {{ errorMessage }}
            </div>
            }

            <button type="submit" [disabled]="loading">
                @if (loading) {
                Entrando...
                } @else {
                Entrar
                }
            </button>

        </form>

    </div>

</div>
